[tool:pytest]
minversion = 8.4

testpaths =
    tests/unit
    tests/integration

python_files = test_*.py
python_functions = test_*

addopts =
    -ra
    --strict-config
    --strict-markers
    --import-mode=importlib

required_plugins =
    pytest-asyncio>=1.3,<2

asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
asyncio_default_test_loop_scope = function